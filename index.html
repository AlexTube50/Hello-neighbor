<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello Neighbor: The dark secrets</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101418;font-family:Arial,sans-serif}
canvas{display:block}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);z-index:10}
#card{width:min(620px,90vw);padding:30px;border-radius:16px;background:#17191d;color:#fff;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#card h1{margin-top:0}
button{border:0;border-radius:10px;padding:13px 28px;font-weight:700;font-size:17px;cursor:pointer}
#hud{position:fixed;inset:0;color:#fff;pointer-events:none;z-index:5}
#objective,#status,#message{position:absolute;background:rgba(0,0,0,.55);border-radius:8px;padding:10px 13px}
#objective{left:16px;top:16px}
#status{right:16px;top:16px}
#message{left:50%;bottom:12%;transform:translateX(-50%);min-width:180px;text-align:center}
#crosshair{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border:1px solid #fff;border-radius:50%}
#loading{position:fixed;left:50%;top:10%;transform:translateX(-50%);z-index:11;color:#fff;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:8px}
</style>
</head>
<body>
<div id="loading">Starting game...</div>
<div id="start">
  <div id="card">
    <h1>Hello Neighbor: The dark secrets</h1>
    <p>Explore the house, open the door, and avoid the Neighbor.</p>
    <p><b>WASD</b> move &nbsp; <b>Mouse</b> look &nbsp; <b>Shift</b> sprint &nbsp; <b>Space</b> jump &nbsp; <b>E</b> door &nbsp; <b>R</b> restart</p>
    <button id="play" type="button">PLAY</button>
  </div>
</div>
<div id="hud">
  <div id="crosshair"></div>
  <div id="objective">Objective: Get inside the house and explore.</div>
  <div id="status">Neighbor: PATROLLING</div>
  <div id="message"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.min.js"></script>
<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const start = $('start');
  const loading = $('loading');
  const objective = $('objective');
  const status = $('status');
  const message = $('message');
  const play = $('play');

  let scene, camera, renderer, clock;
  let menuScene, menuCamera, menuNeighbor, menuClock;
  let yaw = Math.PI, pitch = 0, verticalVelocity = 0, grounded = true;
  let started = false;
  let gameOver = false;
  let neighbor, doorPivot, doorOpen = false;
  let target = null, patrolIndex = 0;
  const keys = new Set();
  const solids = [];

  function mat(color, roughness=0.85){
    return new THREE.MeshStandardMaterial({color, roughness});
  }

  function addBox(name, x,y,z, w,h,d, color, collision=true, parent=scene){
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(color));
    mesh.name = name;
    mesh.position.set(x,y,z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);
    if(collision) solids.push(mesh);
    return mesh;
  }

  function init(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9db7ca);
    scene.fog = new THREE.Fog(0x9db7ca, 45, 150);

    camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.05, 300);
    camera.position.set(0,1.75,30);
    camera.rotation.order = 'YXZ';
    camera.rotation.set(0,0,0);

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xcfe7ff,0x51483d,1.65));
    const sun = new THREE.DirectionalLight(0xfff0d0,2.1);
    sun.position.set(-30,40,25);
    sun.castShadow = true;
    scene.add(sun);

    addWorld();
    addNeighbor();
    addDoor();

    clock = new THREE.Clock();
    loading.textContent = 'Game ready — click PLAY';
    requestAnimationFrame(loop);
    // Custom assets load after the scene is already running. A failed asset cannot blank the game.
    setTimeout(loadAssets, 50);
    setTimeout(loadMenuNeighbor, 50);
  }

  function addWorld(){
    addBox('Grass',0,-0.55,0,100,1,100,0x53733e,true);

    // Road in front of the house.
    const road = new THREE.Mesh(new THREE.PlaneGeometry(100,10), mat(0x3a3a3a,1));
    road.rotation.x = -Math.PI/2;
    road.position.set(0,0.015,-15);
    road.receiveShadow = true;
    scene.add(road);

    // Road edge lines.
    for(const z of [-10,-20]){
      const edge = addBox('RoadEdge',0,0.045,z,100,0.06,0.22,0xc8c8c8,false);
    }

    // Center markings.
    for(let x=-46;x<=46;x+=7){
      addBox('RoadLine',x,0.045,-15,3.4,0.06,0.16,0xe6dfaa,false);
    }

    // Driveway.
    const driveway = new THREE.Mesh(new THREE.PlaneGeometry(7,11), mat(0x565656,1));
    driveway.rotation.x = -Math.PI/2;
    driveway.position.set(0,0.02,-4.9);
    driveway.receiveShadow = true;
    scene.add(driveway);

    // House shell / simple collision-safe fallback.
    addBox('FrontWall',0,4,-9,34,8,1,0xb8a174,true);
    addBox('BackWall',0,4,10,34,8,1,0xa99772,true);
    addBox('LeftWall',-17,4,0,1,8,20,0x9f885f,true);
    addBox('RightWall',17,4,0,1,8,20,0x9f885f,true);
    addBox('HallLeft',-6,4,1,1,8,13,0x8f7b5a,true);
    addBox('HallRight',7,4,-1,1,8,11,0x8f7b5a,true);
    addBox('BackRoomWall',0,4,7,13,8,1,0x7f6c4f,true);

    // Upper floor and stairs.
    addBox('UpperFloor',4,7.2,-1,12,.5,9,0x6d5944,true);
    for(let i=0;i<8;i++){
      addBox('Step'+i,11-i*0.7,0.35+i*0.55,4-i*0.9,3,.7,2.5,0x79634c,true);
    }
  }

  function addDoor(){
    doorPivot = new THREE.Group();
    doorPivot.position.set(0,2.1,-9.5);
    scene.add(doorPivot);

    const slab = new THREE.Mesh(new THREE.BoxGeometry(2.6,4.2,.35), mat(0x4b3427));
    slab.position.x = 1.3;
    slab.castShadow = true;
    slab.receiveShadow = true;
    doorPivot.add(slab);
  }

  function addNeighbor(){
    neighbor = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.2,2.4,.75),mat(0x2c503b));
    body.position.y = 1.2;
    const head = new THREE.Mesh(new THREE.SphereGeometry(.46,18,18),mat(0xc98d6a));
    head.position.y = 2.8;
    const hat = new THREE.Mesh(new THREE.ConeGeometry(.55,.65,4),mat(0x283049));
    hat.position.y = 3.35;
    hat.rotation.y = Math.PI/4;
    neighbor.add(body,head,hat);
    neighbor.position.set(-11,0,4);
    neighbor.traverse(o => { if(o.isMesh){o.castShadow=true;o.receiveShadow=true;} });
    scene.add(neighbor);
  }

  const patrol = [
    new THREE.Vector3(-11,0,4),
    new THREE.Vector3(-11,0,-5),
    new THREE.Vector3(4,0,-5),
    new THREE.Vector3(11,0,5),
    new THREE.Vector3(3,0,7)
  ];

  function startGame(){
    started = true;
    camera.position.set(0,1.75,30);
    yaw=0; pitch=0;
    camera.rotation.set(0,0,0);
    start.style.display='none';
    menuNeighbor = menuNeighbor || null;
    loading.style.display='none';
    message.textContent='';
    document.body.requestPointerLock().catch(() => {});
  }

  play.addEventListener('click', startGame);
  renderer.domElement?.addEventListener('click', () => {
    if(started && document.pointerLockElement !== document.body){
      document.body.requestPointerLock().catch(() => {});
    }
  });

  document.addEventListener('pointerlockchange', () => {
    const locked = document.pointerLockElement === document.body;
    if(locked){
      start.style.display='none';
      loading.style.display='none';
    }else if(!gameOver && !started){
      start.style.display='flex';
      loading.style.display='none';
    }
  });

  document.addEventListener('mousemove', e => {
    if(document.pointerLockElement !== document.body || gameOver) return;
    yaw -= e.movementX * 0.0023;
    pitch -= e.movementY * 0.0023;
    pitch = THREE.MathUtils.clamp(pitch,-1.45,1.45);
    camera.rotation.set(pitch,yaw,0);
  });

  document.addEventListener('keydown', e => {
    keys.add(e.code);
    if(e.code === 'KeyE' && document.pointerLockElement === document.body && !gameOver) toggleDoor();
    if(e.code === 'KeyR' && gameOver) restart();
  });

  document.addEventListener('keyup', e => keys.delete(e.code));

  function playerBlocked(pos){
    const radius=.34;
    const playerBox = new THREE.Box3(
      new THREE.Vector3(pos.x-radius,pos.y,pos.z-radius),
      new THREE.Vector3(pos.x+radius,pos.y+1.7,pos.z+radius)
    );
    for(const s of solids){
      if(s.name === 'Grass') continue;
      if(new THREE.Box3().setFromObject(s).intersectsBox(playerBox)) return true;
    }
    return false;
  }

  function movePlayer(dt){
    let input = new THREE.Vector3();
    if(keys.has('KeyW')) input.z -= 1;
    if(keys.has('KeyS')) input.z += 1;
    if(keys.has('KeyA')) input.x -= 1;
    if(keys.has('KeyD')) input.x += 1;

    if(input.lengthSq()){
      input.normalize();
      const move = new THREE.Vector3(input.x,0,input.z);
      move.applyEuler(new THREE.Euler(0,yaw,0));
      const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight')) ? 7.2 : 4.4;
      const next = camera.position.clone().addScaledVector(move,speed*dt);
      if(!playerBlocked(next)){
        camera.position.x = next.x;
        camera.position.z = next.z;
      }
    }

    if(grounded && keys.has('Space')){
      verticalVelocity=7;
      grounded=false;
    }

    verticalVelocity -= 18*dt;
    camera.position.y += verticalVelocity*dt;
    if(camera.position.y <= 1.75){
      camera.position.y=1.75;
      verticalVelocity=0;
      grounded=true;
    }
  }

  function hasSight(){
    const origin = neighbor.position.clone();
    origin.y += 2.5;
    const targetPos = camera.position.clone();
    const delta = targetPos.clone().sub(origin);
    const distance = delta.length();
    if(distance > 18) return false;

    const flat = new THREE.Vector3(delta.x,0,delta.z).normalize();
    const forward = new THREE.Vector3(0,0,-1).applyQuaternion(neighbor.quaternion);
    forward.y=0;
    forward.normalize();

    if(distance > 8){
      const angle = Math.acos(THREE.MathUtils.clamp(forward.dot(flat),-1,1));
      if(angle > THREE.MathUtils.degToRad(65)) return false;
    }

    const ray = new THREE.Raycaster(origin,delta.normalize(),0,distance);
    const hits = ray.intersectObjects(solids,false);
    return hits.length === 0;
  }

  function moveNeighbor(dt){
    if(hasSight()){
      target = camera.position.clone();
      status.textContent='Neighbor: CHASING';
    }else if(target && neighbor.position.distanceTo(target)>28){
      target=null;
      status.textContent='Neighbor: PATROLLING';
    }

    if(!target){
      target = patrol[patrolIndex];
      if(neighbor.position.distanceTo(target)<0.9){
        patrolIndex=(patrolIndex+1)%patrol.length;
      }
    }

    const destination = target.clone();
    const direction = destination.sub(neighbor.position);
    direction.y=0;

    if(direction.lengthSq()){
      direction.normalize();
      const speed = status.textContent.endsWith('CHASING') ? 5.7 : 2.5;
      neighbor.position.addScaledVector(direction,speed*dt);
      neighbor.lookAt(neighbor.position.clone().add(direction));
    }
  }

  function toggleDoor(){
    if(doorPivot.position.distanceTo(camera.position)>3) return;
    doorOpen=!doorOpen;
    const from=doorPivot.rotation.y;
    const to=doorOpen?-Math.PI/2:0;
    const startTime=performance.now();
    function animateDoor(t){
      const p=Math.min((t-startTime)/350,1);
      doorPivot.rotation.y=THREE.MathUtils.lerp(from,to,p);
      if(p<1) requestAnimationFrame(animateDoor);
    }
    requestAnimationFrame(animateDoor);
    message.textContent = doorOpen ? 'E — Close Door' : 'E — Open Door';
  }

  function checkState(){
    if(camera.position.z < 11){
      objective.textContent='Objective: Explore the house. Find a way upstairs.';
    }
    if(camera.position.y > 6.5){
      objective.textContent='Objective: You reached the upper floor. Keep exploring.';
    }
    if(doorPivot.position.distanceTo(camera.position)<3){
      message.textContent=doorOpen ? 'E — Close Door' : 'E — Open Door';
    }else{
      message.textContent='';
    }

    if(neighbor.position.distanceTo(new THREE.Vector3(camera.position.x,0,camera.position.z))<1.2){
      gameOver=true;
      document.exitPointerLock();
      status.textContent='Neighbor: PLAYER CAUGHT';
      objective.textContent='The Neighbor caught you. Press R to restart.';
      message.textContent='';
    }
  }

  function restart(){
    camera.position.set(0,1.75,-25);
    yaw=0; pitch=0;
    camera.rotation.set(0,0,0);
    neighbor.position.copy(patrol[0]);
    target=null; patrolIndex=0;
    gameOver=false;
    status.textContent='Neighbor: PATROLLING';
    objective.textContent='Objective: Get inside the house and explore.';
    doorPivot.rotation.y=0;
    doorOpen=false;
    started=true;
    start.style.display='none';
    document.body.requestPointerLock().catch(() => {});
  }

  function loadMenuNeighbor(){
    try{
      const loader = new FBXLoader();
      loader.setResourcePath('./assets/menu-neighbor/');
      loader.load('./assets/menu-neighbor/SN Neighbor.fbx', obj => {
        frameAndPositionModel(obj, 5.2);
        obj.position.set(0,0,0);
        menuNeighbor=obj;
        menuScene.add(obj);
      }, undefined, () => {
        // Menu remains black with title and Play button when the optional model is missing.
      });
    }catch(err){
      console.info('Menu Neighbor asset unavailable.', err);
    }
  }

  function frameAndPositionModel(model, targetSize=24){
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const maxSize = Math.max(size.x,size.y,size.z);
    if(maxSize > 0 && (maxSize < 2 || maxSize > 80)){
      const scale = targetSize / maxSize;
      model.scale.multiplyScalar(scale);
    }
    box.setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.x -= center.x;
    model.position.z -= center.z;
    const newBox = new THREE.Box3().setFromObject(model);
    model.position.y -= newBox.min.y;
    model.traverse(o => {
      if(o.isMesh){
        o.castShadow=true;
        o.receiveShadow=true;
        if(o.material) o.material.side=THREE.DoubleSide;
      }
    });
  }

  async function loadAssets(){
    try{
      const {FBXLoader} = await import('https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/loaders/FBXLoader.js');
      const {ColladaLoader} = await import('https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/loaders/ColladaLoader.js');

      const houseLoader = new FBXLoader();
      houseLoader.setResourcePath('./assets/house-textures/');
      houseLoader.load('./assets/house/House_Hello_Neighbor_Act1.fbx', obj => {
        obj.name='Act1HouseImported';
        frameAndPositionModel(obj,34);
        scene.add(obj);
        objective.textContent='Objective: Explore the house and avoid the Neighbor.';
      }, undefined, () => {});

      const roadLoader = new ColladaLoader();
      roadLoader.load('./assets/road/road01.dae', result => {
        const roadModel=result.scene;
        roadModel.name='AmericanRoadImported';
        frameAndPositionModel(roadModel,26);
        roadModel.position.set(0,0,-18);
        roadModel.scale.multiplyScalar(1.8);
        scene.add(roadModel);
      }, undefined, () => {});
    }catch(err){
      console.info('Optional custom models unavailable; built-in game world remains active.',err);
    }
  }

  async function loadMenuNeighbor(){
    try{
      const {FBXLoader} = await import('https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/loaders/FBXLoader.js');
      const loader=new FBXLoader();
      loader.setResourcePath('./assets/menu-neighbor/');
      loader.load('./assets/menu-neighbor/SN Neighbor.fbx',obj=>{
        frameAndPositionModel(obj,5.2);
        obj.position.set(0,0,0);
        menuNeighbor=obj;
        menuScene.add(obj);
      },undefined,()=>{});
    }catch(err){
      console.info('Optional menu model unavailable.',err);
    }
  }



  function loop(){
    requestAnimationFrame(loop);
    const dt=Math.min(clock.getDelta(),0.05);
    if(started && !gameOver){
      movePlayer(dt);
      moveNeighbor(dt);
      checkState();
    }
    renderer.render(scene,camera);
  }

  addEventListener('resize',() => {
    if(!camera || !renderer) return;
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    if(menuCamera){
      menuCamera.aspect=innerWidth/innerHeight;
      menuCamera.updateProjectionMatrix();
    }
    renderer.setSize(innerWidth,innerHeight);
  });

  try{
    init();
  }catch(err){
    loading.textContent='Game startup error — refresh the page.';
    console.error(err);
  }
})();
</script>
</body>
</html>
