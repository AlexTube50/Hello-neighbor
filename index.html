<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello Neighbor: The Murder</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;color:#fff;pointer-events:none}
#crosshair{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-4px;border:1px solid white;border-radius:50%}
#objective,#status,#prompt{position:absolute;background:rgba(0,0,0,.55);border-radius:8px}
#objective{left:16px;top:16px;padding:10px 13px}
#status{right:16px;top:16px;padding:10px 13px}
#prompt{left:50%;bottom:12%;transform:translateX(-50%);padding:9px 13px}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75);z-index:5}
#card{width:min(560px,90vw);background:#181818;color:#eee;padding:30px;border-radius:12px;text-align:center}
button{padding:12px 24px;border:0;border-radius:8px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div id="start"><div id="card">
<h1>Hello Neighbor: The Murder</h1>
<p>Playable browser game. Explore the house and avoid the Neighbor.</p>
<p><b>WASD</b> move · <b>Shift</b> sprint · <b>Space</b> jump · <b>E</b> door · <b>R</b> restart</p>
<button id="play">PLAY</button>
</div></div>
<div id="ui"><div id="crosshair"></div><div id="objective">Objective: Get inside the house and explore.</div><div id="status">Neighbor: PATROLLING</div><div id="prompt"></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";
import { FBXLoader } from "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/loaders/FBXLoader.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9db6c7);
scene.fog=new THREE.Fog(0x9db6c7,45,140);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,250);
camera.position.set(0,1.75,19);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;

scene.add(new THREE.HemisphereLight(0xd8ecff,0x4d433b,1.6));
const sun=new THREE.DirectionalLight(0xfff0cf,2);
sun.position.set(-25,35,20);sun.castShadow=true;scene.add(sun);

const clock=new THREE.Clock();
camera.rotation.order='YXZ';
let yaw=0;
let pitch=0;
const isLocked=()=>document.pointerLockElement===document.body;
const solids=[];
const doors=[];
const houseRoot=new THREE.Group();
houseRoot.name='ProceduralHouseFallback';
scene.add(houseRoot);
const keys=new Set();
let vy=0,grounded=true,gameOver=false;
let neighbor,target;
let patrolIndex=0;

function material(c){return new THREE.MeshStandardMaterial({color:c,roughness:.82});}
function box(name,x,y,z,w,h,d,c,collide=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(c));
 m.name=name;m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;houseRoot.add(m);
 if(collide)solids.push(m);
 return m;
}
function addHouse(){
 box('Ground',0,-.4,0,70,.8,70,0x5d694b);
 box('FrontWall',0,4,-9,34,8,1,0xb9a47e);
 box('BackWall',0,4,10,34,8,1,0xa99772);
 box('LeftWall',-17,4,.5,1,8,20,0x9d875f);
 box('RightWall',17,4,.5,1,8,20,0x9d875f);
 box('HallWall1',-6,4,1,1,8,13,0x91805f);
 box('HallWall2',7,4,-1,1,8,11,0x91805f);
 box('RoomWall',0,4,7,13,8,1,0x806f52);
 box('UpperFloor',4,7.2,-1,12,.5,9,0x6e5c48);
 for(let i=0;i<8;i++)box('Step'+i,11-i*.7,.35+i*.55,4-i*.9,3,.7,2.5,0x7a644e);
 const pivot=new THREE.Group();pivot.position.set(0,2.1,-9.5);houseRoot.add(pivot);
 const slab= new THREE.Mesh(new THREE.BoxGeometry(2.6,4.2,.35),material(0x4e372a));
 slab.position.x=1.3;slab.castShadow=true;pivot.add(slab);
 doors.push({pivot,open:false,start:0,end:-Math.PI/2});
}
function makeNeighbor(){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.2,2.4,.75),material(0x2d4f3b));body.position.y=1.2;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.46,18,18),material(0xc88c69));head.position.y=2.8;g.add(head);
 const hat=new THREE.Mesh(new THREE.ConeGeometry(.55,.65,4),material(0x253044));hat.position.y=3.35;hat.rotation.y=Math.PI/4;g.add(hat);
 g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
 g.position.set(-11,0,4);scene.add(g);return g;
}
addHouse();

// Load the supplied Act 1 FBX when it is uploaded to assets/House_Hello_Neighbor_Act1.fbx.
// The fallback procedural house stays visible if the browser cannot load the asset.
const fbxLoader = new FBXLoader();
fbxLoader.setPath('./assets/');
fbxLoader.setResourcePath('./assets/textures/');
fbxLoader.load(
  'House_Hello_Neighbor_Act1.fbx',
  (model) => {
    model.name = 'Act1HouseModel';
    model.scale.setScalar(0.01);
    model.traverse((o) => {
      if (o.isMesh) {
        o.castShadow = true;
        o.receiveShadow = true;
        if (o.material) {
          o.material.side = THREE.DoubleSide;
        }
      }
    });
    scene.add(model);
    houseRoot.visible = false;
    document.getElementById('objective').textContent='Objective: Explore the house and avoid the Neighbor.';
  },
  undefined,
  (error) => {
    console.warn('Act 1 FBX not loaded. Upload assets/House_Hello_Neighbor_Act1.fbx to use the supplied model.', error);
  }
);

neighbor=makeNeighbor();
// Collision bounds for the imported house. These are intentionally separate from visual geometry.\nif (!solids.some(s => s.name==='ImportedWallFront')) {\n  box('ImportedWallFront',0,4,-9,34,8,1,0xffffff);\n  box('ImportedWallBack',0,4,10,34,8,1,0xffffff);\n  box('ImportedWallLeft',-17,4,.5,1,8,20,0xffffff);\n  box('ImportedWallRight',17,4,.5,1,8,20,0xffffff);\n}\nhouseRoot.children.filter(o=>o.isMesh && o.name.startsWith('ImportedWall')).forEach(o=>{o.visible=false;});\n\nconst patrol=[new THREE.Vector3(-11,0,4),new THREE.Vector3(-11,0,-5),new THREE.Vector3(4,0,-5),new THREE.Vector3(11,0,5),new THREE.Vector3(3,0,7)];

function hitAt(pos){
 const r=.34;
 const pbox=new THREE.Box3(new THREE.Vector3(pos.x-r,pos.y,pos.z-r),new THREE.Vector3(pos.x+r,pos.y+1.7,pos.z+r));
 for(const m of solids){if(m.name==='Ground')continue; if(new THREE.Box3().setFromObject(m).intersectsBox(pbox))return true;}
 return false;
}
function visibleToPlayer(){
 const eye=neighbor.position.clone();eye.y+=2.5;
 const dir=camera.position.clone().sub(eye);
 const d=dir.length();if(d>18)return false;
 const flat=new THREE.Vector3(dir.x,0,dir.z).normalize();
 const forward=new THREE.Vector3(0,0,-1).applyQuaternion(neighbor.quaternion);forward.y=0;forward.normalize();
 if(d>8 && THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(forward.dot(flat),-1,1)))>60)return false;
 const ray=new THREE.Raycaster(eye,dir.normalize(),0,d);
 const hits=ray.intersectObjects(solids,false);
 return hits.length===0;
}
function movePlayer(dt){
 let dir=new THREE.Vector3();
 if(keys.has('KeyW'))dir.z-=1;if(keys.has('KeyS'))dir.z+=1;if(keys.has('KeyA'))dir.x-=1;if(keys.has('KeyD'))dir.x+=1;
 if(dir.lengthSq()){dir.normalize();const y=camera.rotation.y;const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,y,0));dir.applyQuaternion(q);
  const speed=(keys.has('ShiftLeft')||keys.has('ShiftRight'))?7:4.2;
  const next=camera.position.clone().addScaledVector(dir,speed*dt);
  if(!hitAt(next)){camera.position.x=next.x;camera.position.z=next.z;}
 }
 if(grounded&&keys.has('Space')){vy=7;grounded=false}
 vy-=18*dt;camera.position.y+=vy*dt;
 if(camera.position.y<=1.75){camera.position.y=1.75;vy=0;grounded=true;}
}
function moveNeighbor(dt){
 let sees=visibleToPlayer();
 if(sees){target=camera.position.clone();document.getElementById('status').textContent='Neighbor: CHASING';}
 else if(target&&neighbor.position.distanceTo(target)>27){target=null;}
 if(!target){target=patrol[patrolIndex];if(neighbor.position.distanceTo(target)<.8)patrolIndex=(patrolIndex+1)%patrol.length;}
 const chasing=document.getElementById('status').textContent.endsWith('CHASING');
 const dir=target.clone().sub(neighbor.position);dir.y=0;
 if(dir.lengthSq()){dir.normalize();neighbor.position.addScaledVector(dir,(chasing?5.6:2.4)*dt);neighbor.lookAt(neighbor.position.clone().add(dir));}
}
function interact(){
 let best=null,bestD=3;
 for(const d of doors){const dist=d.pivot.position.distanceTo(camera.position);if(dist<bestD){best=d;bestD=dist;}}
 if(!best)return;
 best.open=!best.open;
 const a=best.open?best.end:best.start;
 const from=best.pivot.rotation.y;const begin=performance.now();
 function animateDoor(t){
  const x=Math.min((t-begin)/350,1);best.pivot.rotation.y=THREE.MathUtils.lerp(from,a,x);if(x<1)requestAnimationFrame(animateDoor);
 }
 requestAnimationFrame(animateDoor);
}
function reset(){
 camera.position.set(0,1.75,19);neighbor.position.copy(patrol[0]);neighbor.rotation.set(0,0,0);
 target=null;patrolIndex=0;gameOver=false;
 document.getElementById('status').textContent='Neighbor: PATROLLING';
 document.getElementById('objective').textContent='Objective: Get inside the house and explore.';
 document.body.requestPointerLock();
}
addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='KeyE'&&isLocked()&&!gameOver)interact();if(e.code==='KeyR'&&gameOver)reset();});
addEventListener('keyup',e=>keys.delete(e.code));
document.getElementById('play').onclick=()=>document.body.requestPointerLock();
document.addEventListener('mousemove',(e)=>{
  if(!isLocked()) return;
  yaw -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = THREE.MathUtils.clamp(pitch,-1.45,1.45);
  camera.rotation.set(pitch,yaw,0);
});
document.addEventListener('pointerlockchange',()=>{
  if(isLocked()){
    document.getElementById('start').style.display='none';
  }else if(!gameOver){
    document.getElementById('start').style.display='flex';
  }
});

function updateUI(){
 if(camera.position.z < 10){
  document.getElementById('objective').textContent='Objective: Explore the house. Find a way upstairs.';
 }
 if(camera.position.y > 6.5){
  document.getElementById('objective').textContent='Objective: You reached the upper floor. Keep exploring.';
 }
 let text='';
 for(const d of doors)if(d.pivot.position.distanceTo(camera.position)<3)text=d.open?'E - Close Door':'E - Open Door';
 document.getElementById('prompt').textContent=text;
 if(neighbor.position.distanceTo(new THREE.Vector3(camera.position.x,0,camera.position.z))<1.25){
  gameOver=true;document.exitPointerLock();
  document.getElementById('status').textContent='Neighbor: PLAYER CAUGHT';
  document.getElementById('objective').textContent='The Neighbor caught you. Press R to restart.';
  document.getElementById('prompt').textContent='';
 }
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);
 if(isLocked()&&!gameOver){movePlayer(dt);moveNeighbor(dt);updateUI();}
 renderer.render(scene,camera);}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
animate();
</script>
</body>
</html>
