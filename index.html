<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello Neighbor: The dark secrets</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#menu{
 position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at 50% 42%,#111 0%,#030303 45%,#000 78%);
 color:#fff;text-align:center
}
#menuBox{min-width:340px;max-width:780px;padding:48px 56px;text-shadow:0 2px 10px rgba(0,0,0,.9)}
#menuBox:after{content:"";display:block;width:140px;height:1px;background:#555;margin:28px auto 0;box-shadow:0 0 18px #aaa}
#menu h1{font-size:clamp(32px,5vw,58px);margin:0 0 18px;font-weight:800;letter-spacing:.4px}
#menu p{font-size:17px;line-height:1.55;color:#d0d0d0;margin:8px 0}
#play{
 margin-top:22px;padding:14px 40px;border:0;border-radius:6px;background:#fff;color:#000;
 font-size:20px;font-weight:800;cursor:pointer
}
#play:hover{background:#ddd}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;color:#fff}
#objective,#status,#hint{
 position:absolute;background:rgba(0,0,0,.54);border-radius:8px;padding:9px 12px;
 text-shadow:0 1px 2px #000
}
#objective{left:14px;top:14px}
#status{right:14px;top:14px}
#hint{left:50%;bottom:25px;transform:translateX(-50%);min-width:180px;text-align:center}
#staminaWrap{position:absolute;left:14px;bottom:14px;width:180px;height:7px;background:rgba(0,0,0,.55);border-radius:5px;overflow:hidden}
#stamina{height:100%;width:100%;background:#ddd}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(circle,rgba(0,0,0,0) 38%,rgba(0,0,0,.22) 72%,rgba(0,0,0,.65) 100%)}
#crosshair{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-4px;border:1px solid #fff;border-radius:50%}
#blackout{
 position:fixed;inset:0;display:none;z-index:30;align-items:center;justify-content:center;
 background:rgba(0,0,0,.82);color:#fff;text-align:center
}
#blackoutBox{padding:30px}
#blackout h2{font-size:42px;margin:0 0 14px}
#blackout button{padding:11px 26px;border:0;border-radius:6px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="menu">
  <div id="menuBox">
    <h1>Hello Neighbor: The dark secrets</h1>
    <p>Explore the house. Find a way inside.</p>
    <p><b>WASD</b> Move &nbsp; <b>Mouse</b> Look &nbsp; <b>Shift</b> Sprint &nbsp; <b>Space</b> Jump &nbsp; <b>E</b> Door &nbsp; <b>R</b> Restart</p>
    <button id="play" type="button">PLAY</button>
  </div>
</div>

<canvas id="game" tabindex="0"></canvas>

<div id="hud">
  <div id="crosshair"></div>
  <div id="staminaWrap"><div id="stamina"></div></div>
  <div id="objective">Objective: Get inside the house and explore.</div>
  <div id="status">Neighbor: PATROLLING</div>
  <div id="hint"></div>
</div>
<div id="vignette"></div>

<div id="blackout">
  <div id="blackoutBox">
    <h2>Caught</h2>
    <p>The Neighbor caught you.</p>
    <button id="restartButton" type="button">RESTART</button>
  </div>
</div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', {alpha:false});
const menu = document.getElementById('menu');
const playButton = document.getElementById('play');
const blackout = document.getElementById('blackout');
const restartButton = document.getElementById('restartButton');
const objective = document.getElementById('objective');
const status = document.getElementById('status');
const hint = document.getElementById('hint');
const staminaBar = document.getElementById('stamina');

let W=innerWidth, H=innerHeight;
let started=false, gameOver=false;
let yaw=0, pitch=0;
let cameraBob=0, walkCycle=0, elapsed=0, stamina=100;
let lastTime=performance.now();
let mouseLook=false;
const keys=new Set();

const FOV=Math.PI/3;
const HALF_FOV=FOV/2;
const RAYS=Math.max(320,Math.min(560,Math.floor(innerWidth*.45)));
let zBuffer=new Float32Array(RAYS);

const player={
  x:0,
  y:9.2,
  h:1.72,
  radius:.28,
  speed:3.8,
  sprint:6.2,
  vy:0,
  grounded:true
};

// Road is in front of the house (negative y).
const ROAD_Y=-9.4;
const ROAD_HALF=1.8;

// Axis-aligned collision boxes: x,y,width,height.
const walls=[
  // Outer house
  {x:-8,y:-4,w:6.2,h:.35,name:'front-left'},
  {x:1.8,y:-4,w:6.2,h:.35,name:'front-right'},
  {x:-8,y:3.65,w:16,h:.35,name:'back'},
  {x:-8,y:-4,w:.35,h:8,name:'left'},
  {x:7.65,y:-4,w:.35,h:8,name:'right'},

  // Interior layout
  {x:-4.5,y:-2.3,w:.32,h:6,name:'hall-left'},
  {x:4.2,y:-4,w:.32,h:5.2,name:'hall-right'},
  {x:-4.5,y:-2.3,w:2.8,h:.32,name:'room-wall'},
  {x:1.4,y:1.4,w:6.6,h:.32,name:'rear-room'},
  {x:-1.0,y:1.4,w:.32,h:2.25,name:'stair-side'}
];

const door={
  x:-1.0, y:-4.02, w:2.8, h:.38, open:false
};

const patrol=[
  {x:-6.2,y:1.8},
  {x:-6.2,y:-2.8},
  {x:4.8,y:-2.8},
  {x:5.8,y:2.0},
  {x:0,y:2.7}
];

const neighbor={
  x:-6.2,y:1.8,
  angle:0,
  speed:1.8,
  chaseSpeed:3.2,
  target:null,
  patrol:0
};

function resize(){
  W=innerWidth; H=innerHeight;
  canvas.width=Math.max(640, Math.floor(W*devicePixelRatio));
  canvas.height=Math.max(360, Math.floor(H*devicePixelRatio));
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  W=innerWidth; H=innerHeight;
}
addEventListener('resize',resize);
resize();

function normAngle(a){
  while(a>Math.PI)a-=Math.PI*2;
  while(a<-Math.PI)a+=Math.PI*2;
  return a;
}
function getHorizon(){
  return H*.48+pitch*H*.16+cameraBob;
}
function hexToRgb(hex){
  const n=parseInt(hex.slice(1),16);
  return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};
}
function rgbToCss(c){
  return 'rgb('+Math.round(c.r)+','+Math.round(c.g)+','+Math.round(c.b)+')';
}
function fogColor(rgb, amount){
  const f={r:88,g:103,b:111};
  return {
    r:rgb.r*(1-amount)+f.r*amount,
    g:rgb.g*(1-amount)+f.g*amount,
    b:rgb.b*(1-amount)+f.b*amount
  };
}

function pointInBox(px,py,b,margin=0){
  return px>=b.x-margin && px<=b.x+b.w+margin && py>=b.y-margin && py<=b.y+b.h+margin;
}

function blocked(px,py){
  for(const b of walls){
    if(pointInBox(px,py,b,player.radius)) return true;
  }
  if(!door.open && pointInBox(px,py,door,player.radius)) return true;
  return false;
}

function moveWithCollision(dx,dy){
  const nx=player.x+dx;
  if(!blocked(nx,player.y)) player.x=nx;
  const ny=player.y+dy;
  if(!blocked(player.x,ny)) player.y=ny;
}

function rayBoxDistance(ox,oy,dx,dy,b){
  let tmin=-Infinity,tmax=Infinity;

  if(Math.abs(dx)<1e-8){
    if(ox<b.x || ox>b.x+b.w) return Infinity;
  }else{
    const tx1=(b.x-ox)/dx;
    const tx2=(b.x+b.w-ox)/dx;
    tmin=Math.max(tmin,Math.min(tx1,tx2));
    tmax=Math.min(tmax,Math.max(tx1,tx2));
  }

  if(Math.abs(dy)<1e-8){
    if(oy<b.y || oy>b.y+b.h) return Infinity;
  }else{
    const ty1=(b.y-oy)/dy;
    const ty2=(b.y+b.h-oy)/dy;
    tmin=Math.max(tmin,Math.min(ty1,ty2));
    tmax=Math.min(tmax,Math.max(ty1,ty2));
  }

  if(tmax<Math.max(tmin,0)) return Infinity;
  return tmin>0?tmin:tmax>0?tmax:Infinity;
}

function sceneDistance(ox,oy,dx,dy){
  let best=60;
  for(const b of walls){
    const d=rayBoxDistance(ox,oy,dx,dy,b);
    if(d>0 && d<best) best=d;
  }
  if(!door.open){
    const d=rayBoxDistance(ox,oy,dx,dy,door);
    if(d>0 && d<best) best=d;
  }
  return best;
}

function hasLineOfSight(ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay;
  const dist=Math.hypot(dx,dy);
  if(dist<.001) return true;
  const hit=sceneDistance(ax,ay,dx/dist,dy/dist);
  return hit >= dist-.12;
}

function neighborSeesPlayer(){
  const dx=player.x-neighbor.x,dy=player.y-neighbor.y;
  const dist=Math.hypot(dx,dy);
  if(dist>13) return false;
  const facing=Math.atan2(dy,dx);
  const diff=Math.abs(normAngle(facing-neighbor.angle));
  if(dist>5 && diff>Math.PI*.36) return false;
  return hasLineOfSight(neighbor.x,neighbor.y,player.x,player.y);
}

function updateNeighbor(dt){
  const sees=neighborSeesPlayer();
  if(sees){
    neighbor.target={x:player.x,y:player.y};
    status.textContent='Neighbor: CHASING';
  }else if(neighbor.target){
    const lost=Math.hypot(player.x-neighbor.target.x,player.y-neighbor.target.y);
    if(lost>8){
      neighbor.target=null;
      status.textContent='Neighbor: PATROLLING';
    }
  }

  if(!neighbor.target){
    const p=patrol[neighbor.patrol];
    neighbor.target=p;
    if(Math.hypot(neighbor.x-p.x,neighbor.y-p.y)<.45){
      neighbor.patrol=(neighbor.patrol+1)%patrol.length;
      neighbor.target=patrol[neighbor.patrol];
    }
  }

  const tx=neighbor.target.x-neighbor.x;
  const ty=neighbor.target.y-neighbor.y;
  const d=Math.hypot(tx,ty);
  if(d>.02){
    neighbor.angle=Math.atan2(ty,tx);
    const speed=sees?neighbor.chaseSpeed:neighbor.speed;
    const step=Math.min(d,speed*dt);
    const nx=neighbor.x+Math.cos(neighbor.angle)*step;
    const ny=neighbor.y+Math.sin(neighbor.angle)*step;
    if(!walls.some(b=>pointInBox(nx,ny,b,.24))){
      neighbor.x=nx;
      neighbor.y=ny;
    }
  }

  if(Math.hypot(player.x-neighbor.x,player.y-neighbor.y)<.75) caught();
}

function caught(){
  if(gameOver) return;
  gameOver=true;
  blackout.style.display='flex';
  status.textContent='Neighbor: PLAYER CAUGHT';
  hint.textContent='';
}

function resetGame(){
  player.x=0;
  player.y=9.2;
  player.vy=0;
  player.grounded=true;
  stamina=100;
  yaw=0;
  pitch=0;
  neighbor.x=patrol[0].x;
  neighbor.y=patrol[0].y;
  neighbor.angle=0;
  neighbor.target=null;
  neighbor.patrol=0;
  door.open=false;
  gameOver=false;
  started=true;
  blackout.style.display='none';
  menu.style.display='none';
  objective.textContent='Objective: Get inside the house and explore.';
  status.textContent='Neighbor: PATROLLING';
  hint.textContent='Reach the house. E opens the front door.';
}

function startGame(){
  started=true;
  gameOver=false;
  menu.style.display='none';
  blackout.style.display='none';
  player.x=0;
  player.y=9.2;
  player.vy=0;
  player.grounded=true;
  yaw=0;
  pitch=0;
  neighbor.x=patrol[0].x;
  neighbor.y=patrol[0].y;
  neighbor.target=null;
  neighbor.patrol=0;
  status.textContent='Neighbor: PATROLLING';
  objective.textContent='Objective: Get inside the house and explore.';
  hint.textContent='Reach the house. E opens the front door.';
  canvas.focus();
  try{ canvas.requestPointerLock(); }catch(e){}
}
playButton.addEventListener('click',startGame);
restartButton.addEventListener('click',resetGame);

document.addEventListener('pointerlockchange',()=>{
  mouseLook=document.pointerLockElement===canvas;
});

canvas.addEventListener('click',()=>{
  if(started && !gameOver){
    try{canvas.requestPointerLock();}catch(e){}
  }
});

document.addEventListener('mousemove',e=>{
  if(!started || gameOver) return;
  if(mouseLook){
    yaw += e.movementX*.0022;
    pitch -= e.movementY*.0017;
    pitch=Math.max(-.95,Math.min(.95,pitch));
  }
});

document.addEventListener('keydown',e=>{
  keys.add(e.code);

  if(e.code==='KeyE' && started && !gameOver){
    const d=Math.hypot(player.x-0,player.y-(-3.9));
    if(d<3.2){
      door.open=!door.open;
      hint.textContent=door.open?'Front door open. Explore the house.':'Front door closed.';
    }
  }

  if(e.code==='KeyR' && gameOver) resetGame();
});

document.addEventListener('keyup',e=>keys.delete(e.code));

function updatePlayer(dt){
  let ax=0,ay=0;
  if(keys.has('KeyW')) ay-=1;
  if(keys.has('KeyS')) ay+=1;
  if(keys.has('KeyA')) ax-=1;
  if(keys.has('KeyD')) ax+=1;

  const moving=!!(ax||ay);
  const wantsSprint=keys.has('ShiftLeft')||keys.has('ShiftRight');
  const sprinting=wantsSprint && moving && stamina>1;
  if(sprinting) stamina=Math.max(0,stamina-dt*24);
  else stamina=Math.min(100,stamina+dt*17);
  staminaBar.style.width=stamina+'%';

  if(moving){
    const l=Math.hypot(ax,ay);
    ax/=l; ay/=l;
    const cs=Math.cos(yaw),sn=Math.sin(yaw);
    const worldX=ax*cs-ay*sn;
    const worldY=ax*sn+ay*cs;
    const speed=sprinting?player.sprint:player.speed;

    // Small acceleration/deceleration makes movement feel less robotic.
    moveWithCollision(worldX*speed*dt,worldY*speed*dt);

    walkCycle += dt*(sprinting?15:10);
    const targetBob=Math.sin(walkCycle)*((sprinting?2.8:1.9))+
      Math.sin(walkCycle*2.03)*.55;
    cameraBob += (targetBob-cameraBob)*Math.min(1,dt*12);
  }else{
    cameraBob += (0-cameraBob)*Math.min(1,dt*12);
  }

  if(player.grounded && keys.has('Space')){
    player.vy=6.5;
    player.grounded=false;
  }
  player.vy-=17*dt;
  player.h+=player.vy*dt;
  if(player.h<=1.72){
    player.h=1.72;
    player.vy=0;
    player.grounded=true;
  }
}

function drawEnvironmentDetails(){
  const horizon=getHorizon();

  // Distant hills.
  ctx.fillStyle='rgba(28,44,37,.45)';
  ctx.beginPath();
  ctx.moveTo(0,horizon);
  for(let x=0;x<=W;x+=70){
    const y=horizon-18-Math.sin(x*.008)*14-Math.sin(x*.021)*9;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,horizon);
  ctx.closePath();
  ctx.fill();

  // Moon and a few subtle stars for a late-evening horror atmosphere.
  if(horizon>80){
    ctx.fillStyle='rgba(245,245,220,.9)';
    ctx.beginPath();
    ctx.arc(W*.82,H*.16,Math.min(W,H)*.045,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.55)';
    for(let i=0;i<45;i++){
      const sx=(i*137.7)%W, sy=(i*53.2)%(H*.33);
      const r=1+(i%3)*.35;
      ctx.fillRect(sx,sy,r,r);
    }
  }

  // Wooden fence posts along the yard.
  for(let x=-18;x<=18;x+=3){
    const p=worldToScreen(x,1.8);
    if(!p||p.y<0||p.y>H) continue;
    const height=Math.max(6,20/(Math.abs(p.y-horizon)+1)*H);
    ctx.fillStyle='#594534';
    ctx.fillRect(p.x-2,p.y-height,4,height);
  }

  // Trees on the far side of the road.
  const trees=[[-18,-5],[-13,-1],[15,-2],[20,3],[-20,6],[18,7]];
  for(const [tx,ty] of trees){
    const p=worldToScreen(tx,ty);
    if(!p) continue;
    const size=Math.max(14,90/Math.max(4,Math.hypot(tx-player.x,ty-player.y)));
    ctx.fillStyle='#2d241d';
    ctx.fillRect(p.x-size*.06,p.y-size*.45,size*.12,size*.65);
    ctx.fillStyle='#1f3528';
    ctx.beginPath();
    ctx.arc(p.x,p.y-size*.55,size*.42,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='rgba(54,79,56,.7)';
    ctx.beginPath();
    ctx.arc(p.x-size*.22,p.y-size*.62,size*.26,0,Math.PI*2);
    ctx.arc(p.x+size*.2,p.y-size*.58,size*.29,0,Math.PI*2);
    ctx.fill();
  }

  // Porch/front light glow.
  if(Math.abs(player.y-(-4))<20){
    const p=worldToScreen(0,-3.95);
    if(p){
      const glow=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,Math.min(W,H)*.16);
      glow.addColorStop(0,'rgba(255,213,143,.15)');
      glow.addColorStop(1,'rgba(255,213,143,0)');
      ctx.fillStyle=glow;
      ctx.fillRect(p.x-Math.min(W,H)*.16,p.y-Math.min(W,H)*.16,Math.min(W,H)*.32,Math.min(W,H)*.32);
    }
  }
}

function drawSky(){
  const horizon=getHorizon();
  const sky=ctx.createLinearGradient(0,0,0,horizon);
  sky.addColorStop(0,'#6e8595');
  sky.addColorStop(1,'#b4c4cb');
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,horizon);

  ctx.fillStyle='#293a2e';
  ctx.fillRect(0,horizon,W,H-horizon);
  // Thin cloud layers.
  ctx.fillStyle='rgba(55,66,70,.17)';
  for(let i=0;i<6;i++){
    const cy=H*.08+i*H*.055+Math.sin(elapsed*.05+i)*7;
    ctx.beginPath();
    ctx.ellipse(W*(.12+i*.17),cy,Math.min(W,H)*.12,Math.min(W,H)*.022,0,0,Math.PI*2);
    ctx.fill();
  }
}

function worldToScreen(wx,wy){
  const dx=wx-player.x,dy=wy-player.y;
  const cs=Math.cos(-yaw),sn=Math.sin(-yaw);
  const cx=dx*cs-dy*sn;
  const cy=dx*sn+dy*cs;
  if(cy>=-.01) return null;
  const sx=W/2 + (cx/(-cy))*W/(2*Math.tan(HALF_FOV));
  const horizon=getHorizon();
  const sy=horizon - (player.h/(-cy))*H;
  return {x:sx,y:sy};
}

function drawFloor(){
  const horizon=getHorizon();
  for(let sy=horizon+2;sy<H;sy+=3){
    const denom=sy-horizon;
    if(denom<=0)continue;
    const dist=player.h*H/denom;
    const angLeft=yaw-HALF_FOV;
    const angRight=yaw+HALF_FOV;
    const lx=player.x+Math.sin(angLeft)*dist;
    const ly=player.y-Math.cos(angLeft)*dist;
    const rx=player.x+Math.sin(angRight)*dist;
    const ry=player.y-Math.cos(angRight)*dist;
    const mx=(lx+rx)/2, my=(ly+ry)/2;

    const road=Math.abs(my-ROAD_Y)<=ROAD_HALF;
    if(road){
      const wear=(Math.sin(mx*1.7+my*.8)+Math.sin(mx*4.9-my*1.4))*.5;
      const v=Math.max(42,Math.min(68,54+wear*5));
      ctx.fillStyle='rgb('+v+','+v+','+(v+2)+')';
    }else{
      const n=(Math.sin(mx*6.13+my*3.71)+Math.sin(mx*15.7-my*8.2)+Math.sin(mx*31.1+my*12.4))*.5;
      const r=Math.max(48,Math.min(102,76+n*10));
      const g=Math.max(65,Math.min(116,91+n*13));
      const b=Math.max(38,Math.min(68,49+n*7));
      ctx.fillStyle='rgb('+r+','+g+','+b+')';
    }
    ctx.fillRect(0,sy,W,3);
  }

  // Subtle grass blades near the player.
  if(player.y>ROAD_Y){
    for(let i=0;i<38;i++){
      const gx=player.x+Math.sin(i*17.1+elapsed)*7;
      const gy=player.y+5+(i%9)*1.4;
      const p=worldToScreen(gx,gy);
      if(p && p.y>getHorizon()){
        const h=5+((i*13)%8);
        ctx.strokeStyle='rgba(30,55,28,.55)';
        ctx.beginPath();
        ctx.moveTo(p.x,p.y);
        ctx.lineTo(p.x+Math.sin(i)*2,p.y-h);
        ctx.stroke();
      }
    }
  }
}

function drawRoadMarkings(){
  // Project a few center-line dash segments.
  for(let y=ROAD_Y-2.2;y>ROAD_Y-80;y-=5.4){
    if(Math.abs(y-player.y)<.5) continue;
    const p1=worldToScreen(-.08,y);
    const p2=worldToScreen(.08,y);
    const p3=worldToScreen(.08,y+1.8);
    const p4=worldToScreen(-.08,y+1.8);
    if(!p1||!p2||!p3||!p4) continue;
    ctx.fillStyle='#e7dfad';
    ctx.beginPath();
    ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.lineTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);
    ctx.fill();
  }

  for(let y=ROAD_Y-1.2;y>ROAD_Y-65;y-=8){
    const a=worldToScreen(-3.65,y);
    if(a){ctx.fillStyle='rgba(220,220,205,.6)';ctx.fillRect(a.x-1,a.y-2,2,4);}
    const b=worldToScreen(3.65,y);
    if(b){ctx.fillStyle='rgba(220,220,205,.6)';ctx.fillRect(b.x-1,b.y-2,2,4);}
  }
}

function renderWalls(){
  const horizon=getHorizon();

  for(let i=0;i<RAYS;i++){
    const cameraX=(i/(RAYS-1))-.5;
    const rayAngle=yaw+cameraX*FOV;
    const dx=Math.sin(rayAngle),dy=-Math.cos(rayAngle);
    let dist=sceneDistance(player.x,player.y,dx,dy);
    dist*=Math.cos(cameraX*FOV);
    zBuffer[i]=dist;

    const wallH=Math.min(H*1.8,(player.h/dist)*H*1.35);
    const top=horizon-wallH;
    const bottom=horizon+wallH*.05;
    const sx=player.x+dx*(dist+.03);
    const sy=player.y+dy*(dist+.03);

    let base='#a58f6d';
    if(sy<-3.7)base='#b9a174';
    if(sx<-7.7||sx>7.5)base='#9b835f';
    if(sy>3.4)base='#8e7958';

    let rgb=hexToRgb(base);
    const fog=Math.min(.82,Math.max(0,(dist-12)/42));
    rgb=fogColor(rgb,fog);

    ctx.fillStyle=rgbToCss(rgb);
    ctx.fillRect(i*(W/RAYS),top,(W/RAYS)+1,bottom-top);

    // Painted/stucco panels and wood seams.
    const panelPhase=Math.floor((sx+sy*1.7)*.55);
    if(panelPhase%2===0 && wallH>24){
      ctx.fillStyle='rgba(20,18,14,.10)';
      ctx.fillRect(i*(W/RAYS),top,(W/RAYS)+1,Math.max(1,wallH*.018));
    }

    // Front windows.
    if(Math.abs(sy+4)<.5 && (((sx>-6.2&&sx<-2.1)||(sx>2.1&&sx<6.2)))){
      const wxTop=top+wallH*.28;
      const wxH=Math.max(6,wallH*.28);
      ctx.fillStyle='rgba(22,42,51,.82)';
      ctx.fillRect(i*(W/RAYS),wxTop,(W/RAYS)+1,wxH);
      if(Math.floor(sx*2)%2===0){
        ctx.fillStyle='rgba(190,214,220,.22)';
        ctx.fillRect(i*(W/RAYS),wxTop,(W/RAYS)+1,Math.max(1,wxH*.08));
      }
    }

    // Front door.
    if(Math.abs(sy+4)<.5 && Math.abs(sx)<1.45){
      ctx.fillStyle='#4a2d22';
      ctx.fillRect(i*(W/RAYS),top,(W/RAYS)+1,bottom-top);
      ctx.fillStyle='rgba(0,0,0,.28)';
      ctx.fillRect(i*(W/RAYS),top,(W/RAYS)+1,Math.max(1,wallH*.05));
    }

    // Stronger interior light when close to the walls.
    if(dist<8){
      const light=(1-dist/8)*.08;
      ctx.fillStyle='rgba(255,242,201,'+light+')';
      ctx.fillRect(i*(W/RAYS),top,(W/RAYS)+1,bottom-top);
    }
  }
}

function renderNeighbor(){
  const dx=neighbor.x-player.x,dy=neighbor.y-player.y;
  const dist=Math.hypot(dx,dy);
  if(dist>.05 && dist<28){
    const angle=Math.atan2(dx,-dy);
    const rel=normAngle(angle-yaw);
    if(Math.abs(rel)<HALF_FOV+.18){
      const depth=dist*Math.cos(rel);
      if(depth>0){
        const screenX=W/2 + Math.tan(rel)*W/(2*Math.tan(HALF_FOV));
        const size=Math.min(H*1.2,(2.75/depth)*H);
        const x=screenX-size*.22;
        const y=getHorizon()-size*.7;
        const rayIndex=Math.floor((screenX/W)*(RAYS-1));
        const blocked=rayIndex>=0&&rayIndex<RAYS&&zBuffer[rayIndex]<depth;

        if(!blocked){
          // Ground shadow.
          ctx.fillStyle='rgba(0,0,0,.34)';
          ctx.beginPath();
          ctx.ellipse(screenX,getHorizon()+size*.02,size*.30,size*.07,0,0,Math.PI*2);
          ctx.fill();

          // Legs.
          ctx.strokeStyle='#24352a';
          ctx.lineWidth=Math.max(2,size*.055);
          ctx.beginPath();
          ctx.moveTo(screenX-size*.03,y+size*.72);
          ctx.lineTo(screenX-size*.11,y+size*.95);
          ctx.moveTo(screenX+size*.03,y+size*.72);
          ctx.lineTo(screenX+size*.11,y+size*.95);
          ctx.stroke();

          // Coat/body.
          ctx.fillStyle='#2f523c';
          ctx.fillRect(x+size*.25,y+size*.34,size*.42,size*.47);

          // Arms.
          ctx.strokeStyle='#314b39';
          ctx.lineWidth=Math.max(2,size*.07);
          ctx.beginPath();
          ctx.moveTo(x+size*.27,y+size*.43);
          ctx.lineTo(x+size*.10,y+size*.67);
          ctx.moveTo(x+size*.65,y+size*.43);
          ctx.lineTo(x+size*.82,y+size*.67);
          ctx.stroke();

          // Head.
          ctx.fillStyle='#c78b67';
          ctx.beginPath();
          ctx.arc(screenX,y+size*.23,size*.14,0,Math.PI*2);
          ctx.fill();

          // Hat.
          ctx.fillStyle='#283149';
          ctx.beginPath();
          ctx.moveTo(screenX-size*.18,y+size*.1);
          ctx.lineTo(screenX+size*.18,y+size*.1);
          ctx.lineTo(screenX,y-size*.04);
          ctx.closePath();
          ctx.fill();

          // Face shadow.
          ctx.fillStyle='rgba(50,20,15,.22)';
          ctx.beginPath();
          ctx.arc(screenX+size*.06,y+size*.25,size*.11,0,Math.PI);
          ctx.fill();

          // Eyes.
          ctx.fillStyle='#111';
          ctx.fillRect(screenX-size*.08,y+size*.21,size*.035,size*.03);
          ctx.fillRect(screenX+size*.045,y+size*.21,size*.035,size*.03);
        }
      }
    }
  }
}

function drawDoorHint(){
  const d=Math.hypot(player.x,player.y+3.9);
  if(d<3.3){
    hint.textContent=door.open?'E — Close Door':'E — Open Door';
  }else if(!gameOver){
    if(player.y<4.5) objective.textContent='Objective: Find your way through the house.';
    if(player.y<2) objective.textContent='Objective: Explore the house. Find a way upstairs.';
    if(player.h>2.2) objective.textContent='Objective: You reached the upper level.';
  }
}

function drawAtmosphere(){
  const g=ctx.createRadialGradient(W/2,H*.48,Math.min(W,H)*.18,W/2,H*.48,Math.max(W,H)*.72);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(.65,'rgba(0,0,0,.10)');
  g.addColorStop(1,'rgba(0,0,0,.58)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  const top=ctx.createLinearGradient(0,0,0,H*.22);
  top.addColorStop(0,'rgba(0,0,0,.28)');
  top.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=top;
  ctx.fillRect(0,0,W,H*.22);
}

function render(){
  drawSky();
  drawEnvironmentDetails();
  drawFloor();
  drawRoadMarkings();
  renderWalls();
  renderNeighbor();
  drawDoorHint();
  drawAtmosphere();
}

function loop(now){
  const dt=Math.min(.05,(now-lastTime)/1000);
  lastTime=now;
  elapsed+=dt;
  if(started&&!gameOver){
    updatePlayer(dt);
    updateNeighbor(dt);
  }
  render();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
})();
</script>
